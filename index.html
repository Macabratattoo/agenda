<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Selecione a Cidade</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .city-button {
            background: white;
            border: none;
            border-radius: 12px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .city-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .city-button:active {
            transform: translateY(-2px);
        }

        .city-name {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .city-dates {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 24px;
            }

            .city-name {
                font-size: 20px;
            }

            .city-button {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Agendamento</h1>
            <p>Selecione sua cidade</p>
        </div>

        <div class="buttons-grid">
            <a href="https://v0-skincrack6.vercel.app/?cidade=Cascavel" class="city-button">
                <div class="city-name">Cascavel</div>
                <div class="city-dates">20/07 - 20/10</div>
            </a>

            <a href="https://v0-skincrack6.vercel.app/?cidade=Gravatai" class="city-button">
                <div class="city-name">Gravataí</div>
                <div class="city-dates">01/06 - 18/07</div>
            </a>

            <a href="https://v0-skincrack6.vercel.app/?cidade=Balneario" class="city-button">
                <div class="city-name">Balneário Camboriú</div>
                <div class="city-dates">10/11 - 30/03</div>
            </a>
        </div>
    </div>
</body>
</html>
